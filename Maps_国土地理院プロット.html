<title>配送マップ</title>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
html, body {
    height: 100%;
    margin: 0;
}

#map {
    height: 100%;
    width: 100%;
}

.info {
    position: absolute;
    z-index: 1000;
    top: 10px;
    left: 10px;
    background: white;
    padding: 8px 12px;
    border-radius: 6px;
}

.selector {
    position: absolute;
    z-index: 1000;
    top: 10px;
    right: 10px;
    background: white;
    padding: 8px 12px;
    border-radius: 6px;
    max-height: 75vh;
    overflow-y: auto;
}

.truck-btn {
    display: block;
    width: 100%;
    margin: 3px 0;
    padding: 5px 7px;
    cursor: pointer;
}

.truck-btn.active {
    background: #d7e8ff;
}

.legend-dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-right: 6px;
}

.leaflet-tooltip {
    white-space: nowrap;
    font-weight: bold;
}

/* 地図を白黒化 */
.leaflet-tile {
    filter: grayscale(100%) brightness(115%);
}
</style>
</head>

function clearAllMarkers() {

    allMarkers.forEach(function(marker) {

        if (map.hasLayer(marker)) {
            map.removeLayer(marker);
        }

    });

}

function showTruck(truckNo, buttonElement) {

    clearAllMarkers();

    var visibleLatLngs = [];
    var visibleCount = 0;

    allMarkers.forEach(function(marker) {

        if (truckNo === "99" ||
            String(marker.truckNo) === String(truckNo)) {

            marker.addTo(map);

            visibleLatLngs.push(marker.getLatLng());

            visibleCount += 1;
        }

    });

    document.getElementById("infoBox").innerHTML =
        (truckNo === "99"
            ? "全車表示"
            : truckNo + "号車表示")
        +
        " / 表示件数: "
        +
        visibleCount
        +
        " 件";

    var buttons =
        document.getElementsByClassName("truck-btn");

    for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove("active");
    }

    if (buttonElement) {
        buttonElement.classList.add("active");
    }

    if (visibleLatLngs.length > 0) {

        var bounds =
            L.latLngBounds(visibleLatLngs);

        map.fitBounds(bounds, {
            padding: [30, 30]
        });

    }

}

document.addEventListener(
    "DOMContentLoaded",
    function() {

        var buttons =
            document.getElementsByClassName("truck-btn");

        for (var i = 0; i < buttons.length; i++) {

            buttons[i].addEventListener(
                "click",
                function() {

                    showTruck(
                        this.getAttribute("data-truck"),
                        this
                    );

                }
            );

        }

    }
);
