<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>配送マップ</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet/dist/leaflet.css" />

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
html, body {
    height: 100%;
    margin: 0;
}

#map {
    height: 100%;
    width: 100%;
}

.info {
    position: absolute;
    z-index: 1000;
    top: 10px;
    left: 10px;
    background: white;
    padding: 8px 12px;
    border-radius: 6px;
}

.selector {
    position: absolute;
    z-index: 1000;
    top: 10px;
    right: 10px;
    background: white;
    padding: 8px 12px;
    border-radius: 6px;
    max-height: 75vh;
    overflow-y: auto;
}

.truck-btn {
    display: block;
    width: 100%;
    margin: 3px 0;
    padding: 5px 7px;
    cursor: pointer;
}

.truck-btn.active {
    background: #d7e8ff;
}

.legend-dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-right: 6px;
}

.leaflet-tooltip {
    white-space: nowrap;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="info" id="infoBox">
全件表示 / 表示件数: 4 件
</div>

<div class="selector">
<div><b>号車選択</b></div>
<button class="truck-btn active" data-truck="99">99 全件</button>
<button class="truck-btn" data-truck="13"><span class="legend-dot" style="background:black;"></span>13号車</button>
</div>

<script>

var map = L.map('map').setView(
    [35.82753575, 139.64577100000002],
    12
);

var allMarkers = [];

// ★ OpenStreetMap 標準カラー
L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);


        var marker = L.circleMarker([35.821541, 139.844498], {
            radius: 8,
            color: "black",
            fillColor: "black",
            fillOpacity: 0.85,
            weight: 2
        });

        marker.bindPopup(`<b>号車</b>: 13.0<br><b>コースNo</b>: 39.0<br><b>届先CD</b>: 0489958139<br><b>届先名</b>: 恵和紙興業　八潮<br><b>住所</b>: 埼玉県八潮市二丁目　５００<br><b>配送日</b>: 1<br><b>重量</b>: 7870.0<br><b>メモ</b>: 0489958139  　F有KPP先方　    クランプ有り。広い敷地内で降ろす。巻取りは立て積みOK。<br><b>緯度</b>: 35.821541<br><b>経度</b>: 139.844498<br><b>変換結果</b>: CACHE`);

        marker.bindTooltip(`13号車`, {
            direction: "top",
            sticky: true,
            opacity: 0.95
        });

        marker.truckNo = "13";

        allMarkers.push(marker);

        marker.addTo(map);
        

        var marker = L.circleMarker([35.805111, 139.69165], {
            radius: 8,
            color: "black",
            fillColor: "black",
            fillOpacity: 0.85,
            weight: 2
        });

        marker.bindPopup(`<b>号車</b>: 13.0<br><b>コースNo</b>: 42.0<br><b>届先CD</b>: 0484411298<br><b>届先名</b>: 松崎紙工<br><b>住所</b>: 埼玉県戸田市喜沢南　２－３－８<br><b>配送日</b>: 1<br><b>重量</b>: 5520.0<br><b>メモ</b>: 0484411298  　F有KPP先方　 8：30～   検品終了まで工場の外で待つ。小学生登下校時間帯の入退場要注意！！<br><b>緯度</b>: 35.805111<br><b>経度</b>: 139.69165<br><b>変換結果</b>: CACHE`);

        marker.bindTooltip(`13号車`, {
            direction: "top",
            sticky: true,
            opacity: 0.95
        });

        marker.truckNo = "13";

        allMarkers.push(marker);

        marker.addTo(map);
        

        var marker = L.circleMarker([35.852322, 139.503891], {
            radius: 8,
            color: "black",
            fillColor: "black",
            fillOpacity: 0.85,
            weight: 2
        });

        marker.bindPopup(`<b>号車</b>: 13.0<br><b>コースNo</b>: 44.0<br><b>届先CD</b>: 0492653336<br><b>届先名</b>: （株）新藤慶昌堂　ふじみ野工場<br><b>住所</b>: 埼玉県ふじみ野市亀久保　１１４１－１<br><b>配送日</b>: 4<br><b>重量</b>: 2452.0<br><b>メモ</b>: 0492653336  　F有KPP先方　    入口を入って左側の棟。奥の入口。049-265-3336　にＴＥＬすれば出て来てくれる。8:30～<br><b>緯度</b>: 35.852322<br><b>経度</b>: 139.503891<br><b>変換結果</b>: CACHE`);

        marker.bindTooltip(`13号車`, {
            direction: "top",
            sticky: true,
            opacity: 0.95
        });

        marker.truckNo = "13";

        allMarkers.push(marker);

        marker.addTo(map);
        

        var marker = L.circleMarker([35.831169, 139.543045], {
            radius: 8,
            color: "black",
            fillColor: "black",
            fillOpacity: 0.85,
            weight: 2
        });

        marker.bindPopup(`<b>号車</b>: 13.0<br><b>コースNo</b>: 44.0<br><b>届先CD</b>: 0492746911*<br><b>届先名</b>: 杜陵印刷（株）　埼玉工場<br><b>住所</b>: 埼玉県入間郡三芳町竹間沢３５４－１<br><b>配送日</b>: 1<br><b>重量</b>: 9817.0<br><b>メモ</b>: 0492746911*  　F有KPP先方<br><b>緯度</b>: 35.831169<br><b>経度</b>: 139.543045<br><b>変換結果</b>: CACHE`);

        marker.bindTooltip(`13号車`, {
            direction: "top",
            sticky: true,
            opacity: 0.95
        });

        marker.truckNo = "13";

        allMarkers.push(marker);

        marker.addTo(map);
        

function clearAllMarkers() {

    allMarkers.forEach(function(marker) {

        if (map.hasLayer(marker)) {
            map.removeLayer(marker);
        }

    });

}

function showTruck(truckNo, buttonElement) {

    clearAllMarkers();

    var visibleLatLngs = [];
    var visibleCount = 0;

    allMarkers.forEach(function(marker) {

        if (truckNo === "99" ||
            String(marker.truckNo) === String(truckNo)) {

            marker.addTo(map);

            visibleLatLngs.push(marker.getLatLng());

            visibleCount += 1;
        }

    });

    document.getElementById("infoBox").innerHTML =
        (truckNo === "99"
            ? "全件表示"
            : parseInt(truckNo) + "号車表示")
        +
        " / 表示件数: "
        +
        visibleCount
        +
        " 件";

    var buttons =
        document.getElementsByClassName("truck-btn");

    for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove("active");
    }

    if (buttonElement) {
        buttonElement.classList.add("active");
    }

    if (visibleLatLngs.length > 0) {

        var bounds =
            L.latLngBounds(visibleLatLngs);

        map.fitBounds(bounds, {
            padding: [30, 30]
        });

    }

}

document.addEventListener(
    "DOMContentLoaded",
    function() {

        var buttons =
            document.getElementsByClassName("truck-btn");

        for (var i = 0; i < buttons.length; i++) {

            buttons[i].addEventListener(
                "click",
                function() {

                    showTruck(
                        this.getAttribute("data-truck"),
                        this
                    );

                }
            );

        }

    }
);

var bounds = L.latLngBounds([
[35.821541, 139.844498],
[35.805111, 139.69165],
[35.852322, 139.503891],
[35.831169, 139.543045]
]);

map.fitBounds(bounds, {
    padding: [30, 30]
});

</script>
</body>
</html>
