<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>配送マップ</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet/dist/leaflet.css" />

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
html, body {
    height: 100%;
    margin: 0;
}

#map {
    height: 100%;
    width: 100%;
}

.info {
    position: absolute;
    z-index: 1000;
    top: 10px;
    left: 10px;
    background: white;
    padding: 8px 12px;
    border-radius: 6px;
}

.selector {
    position: absolute;
    z-index: 1000;
    top: 10px;
    right: 10px;
    background: white;
    padding: 8px 12px;
    border-radius: 6px;
    max-height: 75vh;
    overflow-y: auto;
}

.truck-btn {
    display: block;
    width: 100%;
    margin: 3px 0;
    padding: 5px 7px;
    cursor: pointer;
}

.truck-btn.active {
    background: #d7e8ff;
}

.legend-dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-right: 6px;
}

.leaflet-tooltip {
    white-space: nowrap;
    font-weight: bold;
}

/* 地図を白黒化 */
.leaflet-tile {
    filter: grayscale(100%) brightness(115%);
}
</style>
</head>

<body>

<div id="map"></div>

<div class="info" id="infoBox">
全車表示 / 表示件数: 6 件
</div>

<div class="selector">
<div><b>号車選択</b></div>
<button class="truck-btn active" data-truck="99">99 全車</button>
<button class="truck-btn" data-truck="9"><span class="legend-dot" style="background:darkblue;"></span>9号車</button>
</div>

<script>

var map = L.map('map').setView(
    [35.80440216666666, 139.7600405],
    12
);

var allMarkers = [];

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);


        var marker = L.circleMarker([35.800453, 139.763657], {
            radius: 8,
            color: "darkblue",
            fillColor: "darkblue",
            fillOpacity: 0.85,
            weight: 2
        });

        marker.bindPopup(`<b>号車</b>: 9<br><b>コースNo</b>: 40<br><b>届先CD</b>: 0338555241*<br><b>届先名</b>: 昭和倉庫（株）足立断裁<br><b>住所</b>: 足立区入谷６－２－３<br><b>枚数</b>: 002<br><b>重量</b>: 654<br><b>メモ</b>: 0338555241*      新生物流足立内、受付で「昭和断裁分」と申し出て、1番搬入口近くのフォークマンに降ろしてもらう。<br><b>緯度</b>: 35.800453<br><b>経度</b>: 139.763657<br><b>変換結果</b>: CACHE`);

        marker.bindTooltip(`9号車`, {
            direction: "top",
            sticky: true,
            opacity: 0.95
        });

        marker.truckNo = "9";

        allMarkers.push(marker);

        marker.addTo(map);
        

        var marker = L.circleMarker([35.800453, 139.763657], {
            radius: 8,
            color: "darkblue",
            fillColor: "darkblue",
            fillOpacity: 0.85,
            weight: 2
        });

        marker.bindPopup(`<b>号車</b>: 9<br><b>コースNo</b>: 40<br><b>届先CD</b>: 0338558241*<br><b>届先名</b>: 新生物流（株）足立<br><b>住所</b>: 足立区入谷６－２－３<br><b>枚数</b>: 002<br><b>重量</b>: 3217<br><b>メモ</b>: 0338558241*      納品はタブレット受付？1番の枠に停める。<br><b>緯度</b>: 35.800453<br><b>経度</b>: 139.763657<br><b>変換結果</b>: CACHE`);

        marker.bindTooltip(`9号車`, {
            direction: "top",
            sticky: true,
            opacity: 0.95
        });

        marker.truckNo = "9";

        allMarkers.push(marker);

        marker.addTo(map);
        

        var marker = L.circleMarker([35.808331, 139.759125], {
            radius: 8,
            color: "darkblue",
            fillColor: "darkblue",
            fillOpacity: 0.85,
            weight: 2
        });

        marker.bindPopup(`<b>号車</b>: 9<br><b>コースNo</b>: 40<br><b>届先CD</b>: 0358398722<br><b>届先名</b>: 株式会社　工芸社<br><b>住所</b>: 足立区入谷　４－１７－１１<br><b>枚数</b>: 001<br><b>重量</b>: 496<br><b>緯度</b>: 35.808331<br><b>経度</b>: 139.759125<br><b>変換結果</b>: CACHE`);

        marker.bindTooltip(`9号車`, {
            direction: "top",
            sticky: true,
            opacity: 0.95
        });

        marker.truckNo = "9";

        allMarkers.push(marker);

        marker.addTo(map);
        

        var marker = L.circleMarker([35.795277, 139.759644], {
            radius: 8,
            color: "darkblue",
            fillColor: "darkblue",
            fillOpacity: 0.85,
            weight: 2
        });

        marker.bindPopup(`<b>号車</b>: 9<br><b>コースNo</b>: 40<br><b>届先CD</b>: 0482234147<br><b>届先名</b>: 株式会社　シュウエイ<br><b>住所</b>: 埼玉県川口市東領家　４－１６－２０<br><b>枚数</b>: 001<br><b>重量</b>: 755<br><b>メモ</b>: 0482234147      先方降ろし　左か後ろ積み。<br><b>緯度</b>: 35.795277<br><b>経度</b>: 139.759644<br><b>変換結果</b>: CACHE`);

        marker.bindTooltip(`9号車`, {
            direction: "top",
            sticky: true,
            opacity: 0.95
        });

        marker.truckNo = "9";

        allMarkers.push(marker);

        marker.addTo(map);
        

        var marker = L.circleMarker([35.798874, 139.755157], {
            radius: 8,
            color: "darkblue",
            fillColor: "darkblue",
            fillOpacity: 0.85,
            weight: 2
        });

        marker.bindPopup(`<b>号車</b>: 9<br><b>コースNo</b>: 40<br><b>届先CD</b>: 0482255425<br><b>届先名</b>: ＴＯＰＰＡＮ（株）　川口平版印刷<br><b>住所</b>: 埼玉県川口市弥平　４－３－１<br><b>枚数</b>: 002<br><b>重量</b>: 1664<br><b>メモ</b>: 0482255425  　F有KPP先方　    １時間待ちは普通、混んでたら1：30分ぐらい待つ　巻取の場合リンク情報有り。<br><b>緯度</b>: 35.798874<br><b>経度</b>: 139.755157<br><b>変換結果</b>: CACHE`);

        marker.bindTooltip(`9号車`, {
            direction: "top",
            sticky: true,
            opacity: 0.95
        });

        marker.truckNo = "9";

        allMarkers.push(marker);

        marker.addTo(map);
        

        var marker = L.circleMarker([35.823025, 139.759003], {
            radius: 8,
            color: "darkblue",
            fillColor: "darkblue",
            fillOpacity: 0.85,
            weight: 2
        });

        marker.bindPopup(`<b>号車</b>: 9<br><b>コースNo</b>: 40<br><b>届先CD</b>: 0482881020B<br><b>届先名</b>: 株式会社　アイエスアイ<br><b>住所</b>: 埼玉県川口市東本郷１－９－２５<br><b>枚数</b>: 001<br><b>重量</b>: 2365<br><b>メモ</b>: 0482881020B  　F有KPP先方　 ９：００～   　早い時間は積込みで混雑する場合有り。前の道路は駐車禁止　豊通分は受入れに事前電話連絡すること。<br><b>緯度</b>: 35.823025<br><b>経度</b>: 139.759003<br><b>変換結果</b>: CACHE`);

        marker.bindTooltip(`9号車`, {
            direction: "top",
            sticky: true,
            opacity: 0.95
        });

        marker.truckNo = "9";

        allMarkers.push(marker);

        marker.addTo(map);
        

function clearAllMarkers() {

    allMarkers.forEach(function(marker) {

        if (map.hasLayer(marker)) {
            map.removeLayer(marker);
        }

    });

}

function showTruck(truckNo, buttonElement) {

    clearAllMarkers();

    var visibleLatLngs = [];
    var visibleCount = 0;

    allMarkers.forEach(function(marker) {

        if (truckNo === "99" ||
            String(marker.truckNo) === String(truckNo)) {

            marker.addTo(map);

            visibleLatLngs.push(marker.getLatLng());

            visibleCount += 1;
        }

    });

    document.getElementById("infoBox").innerHTML =
        (truckNo === "99"
            ? "全車表示"
            : truckNo + "号車表示")
        +
        " / 表示件数: "
        +
        visibleCount
        +
        " 件";

    var buttons =
        document.getElementsByClassName("truck-btn");

    for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.remove("active");
    }

    if (buttonElement) {
        buttonElement.classList.add("active");
    }

    if (visibleLatLngs.length > 0) {

        var bounds =
            L.latLngBounds(visibleLatLngs);

        map.fitBounds(bounds, {
            padding: [30, 30]
        });

    }

}

document.addEventListener(
    "DOMContentLoaded",
    function() {

        var buttons =
            document.getElementsByClassName("truck-btn");

        for (var i = 0; i < buttons.length; i++) {

            buttons[i].addEventListener(
                "click",
                function() {

                    showTruck(
                        this.getAttribute("data-truck"),
                        this
                    );

                }
            );

        }

    }
);

var bounds = L.latLngBounds([
[35.800453, 139.763657],
[35.800453, 139.763657],
[35.808331, 139.759125],
[35.795277, 139.759644],
[35.798874, 139.755157],
[35.823025, 139.759003]
]);

map.fitBounds(bounds, {
    padding: [30, 30]
});

</script>
</body>
</html>
